name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

env:
  # Force Node 24 actions but strictly prevent interactive prompt locks
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEBIAN_FRONTEND: noninteractive
  CI: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm' # Speeds up npm ci on scheduled runs

      - name: Install dependencies
        run: npm ci --loglevel verbose # Extra logging to track installer progress

      - name: Fix Ubuntu Mirrors & Install Playwright Browsers
        # Sets a 5-minute timeout specifically for this step so it won't hang forever
        timeout-minutes: 5 
        run: |
          echo "Switching to stable global Ubuntu package mirrors..."
          sudo sed -i 's/azure\.archive\.ubuntu\.com/://ubuntu.com' /etc/apt/sources.list
          sudo apt-get update
          
          echo "Installing Playwright system binaries..."
          npx --yes playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
