name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * *' 
    - cron: '30 11 * * *'
  workflow_dispatch:    
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        
    - name: version check
      run: node -v
      
    - name: Install dependencies
      run: npm ci

    # 1. Get the current Playwright version to use as a cache key
    - name: Get Playwright version
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

    # 2. Check for cached browsers (skips download if found)
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-
      
    # 3. Download browsers AND their Ubuntu 24.04 operating system dependencies safely
    - name: Install Playwright Browsers & Deps
      run: npx playwright install --with-deps

    # 4. Run your tests
    - name: Run Playwright tests
      run: npx playwright test
      
    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30